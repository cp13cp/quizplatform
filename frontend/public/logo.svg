<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#4F46E5" opacity="0.1" stroke="#4F46E5" stroke-width="2"/>
  
  <!-- Track symbol (checkmark) -->
  <g stroke="#4F46E5" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Checkmark path -->
    <path d="M 60 100 L 85 125 L 140 70"/>
  </g>
  
  <!-- Number 4 -->
  <g fill="#4F46E5">
    <circle cx="150" cy="130" r="18" fill="#4F46E5" opacity="0.9"/>
    <text x="150" y="140" font-size="24" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">4</text>
  </g>
  
  <!-- Text "Track4u" -->
  <text x="100" y="170" font-size="20" font-weight="bold" fill="#4F46E5" text-anchor="middle" font-family="Arial, sans-serif">Track4u</text>
</svg>